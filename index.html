<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Kompas Concept - 15 juli v2/title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    /* Vaste verticale afstand tussen secties: exact 120px op desktop,
       schaalt naar 60px op schermen kleiner dan 768px */
    --section-spacing: 120px;
  }

  @media (max-width: 768px) {
    :root {
      --section-spacing: 60px;
    }
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #FFFFFF;
  }

  .site-header {
    width: 100%;
    padding: 24px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #FFFFFF;
  }


  .logo {
    height: 24px;
    display: flex;
    align-items: center;
  }
  .logo svg {
    height: 24px;
    width: auto;
    display: block;
  }

  nav.menu {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 24px;
  }

  .menu-item {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16px;
    font-weight: 400;
    line-height: 100%;
    letter-spacing: 0%;
    color: #060B36;
    text-decoration: none;
    padding: 4px 0;
    height: 24px;
    display: inline-flex;
    align-items: center;
    background: none;
    border: none;
    cursor: pointer;
    transition: color 0.15s ease;
  }
  .menu-item:hover {
    color: #6568EF;
  }
  .menu-item:active {
    color: #494CCD;
  }

  .menu-item-group {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .menu-indicator {
    display: flex;
    width: 1.5rem;
    height: 1.5rem;
    padding: 0.4375rem;
    justify-content: center;
    align-items: center;
    gap: 0.625rem;
    border-radius: 6.25rem;
    background: var(--orange-500, #F47B25);
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 12px;
    line-height: 100%;
    color: #FFFFFF;
    box-sizing: border-box;
  }

  .menu-item.cta {
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 500;
    line-height: 100%;
    letter-spacing: 0%;
    color: #FFFFFF;
    background-color: #6568EF;
    padding: 12px;
    height: 40px;
    border-radius: 8px;
    transition: background-color 0.15s ease;
  }
  .menu-item.cta:hover {
    background-color: #494CCD;
    color: #FFFFFF;
  }
  .menu-item.cta:active {
    background-color: #3234AC;
    color: #FFFFFF;
  }

  .menu-burger {
    display: none;
    width: 40px;
    height: 40px;
    align-items: center;
    justify-content: center;
    background-color: #6568EF;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 0.15s ease;
    flex-shrink: 0;
  }
  .menu-burger:hover {
    background-color: #494CCD;
  }
  .menu-burger:active {
    background-color: #3234AC;
  }
  .menu-burger svg {
    width: 16px;
    height: 16px;
    display: block;
  }

  .mobile-menu {
    display: none;
    flex-direction: column;
    gap: 4px;
    padding: 16px 40px 24px;
    background: #FFFFFF;
    border-top: 1px solid #ECECF2;
  }
  .mobile-menu.open {
    display: flex;
  }
  .mobile-menu .menu-item {
    height: auto;
    padding: 10px 0;
  }
  .mobile-menu .menu-item.cta {
    justify-content: center;
    height: 40px;
    margin-top: 8px;
  }

  /* Onder de 1120px passen logo + alle menu-items niet meer naast elkaar
     (7 tekstlinks + Adverteren-button + 24px gaps + logo ≈ 1070px content
     + 80px header padding). Vanaf hier tonen we het burger-alternatief. */
  @media (max-width: 1120px) {
    nav.menu {
      display: none;
    }
    .menu-burger {
      display: flex;
    }
  }

  .hero-frame {
    width: calc(100% - 80px);
    height: 750px;
    margin: 0 40px;
    background-color: #E4E4E9;
    border-radius: 8px;
    position: relative;
    overflow: hidden;
  }

  .hero-media {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .hero-media__asset {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }

  .hero-media__placeholder {
    position: absolute;
    inset: 0;
    background-color: #232C7F;
    display: none;
  }

  .hero-media__placeholder.is-visible {
    display: block;
  }

  .hero-carousel__progress {
    width: 100%;
    height: 2px;
    border-radius: 2px;
    background-color: rgba(255, 255, 255, 0.3);
    overflow: hidden;
  }

  .hero-carousel__progress-fill {
    height: 100%;
    background-color: #F47B25;
    border-radius: 2px;
    transition: width 0.3s ease;
  }

  .hero-label-group {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 3;
    display: flex;
    align-items: stretch;
  }

  .hero-label {
    height: 48px;
    box-sizing: border-box;
    background-color: #060B36;
    color: #FFFFFF;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 14px;
    line-height: 100%;
    letter-spacing: -0.04em;
    padding: 19px 8px 19px 19px;
    border-top-left-radius: 8px;
    white-space: nowrap;
    display: flex;
    align-items: center;
  }

  .hero-corner-accent {
    display: block;
    height: 48px;
    width: auto;
    flex-shrink: 0;
  }

  .cards-section {
    width: calc(100% - 80px);
    margin: 24px 40px 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }

  .info-card {
    height: 96px;
    padding: 16px 24px 16px 16px;
    background-color: #E0E1FE;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 20px;
    border: none;
    text-align: left;
    cursor: pointer;
    transition: background-color 0.15s ease;
  }

  .info-card:hover {
    background-color: #6568EF;
  }

  .info-card:active {
    background-color: #494CCD;
  }

  .info-card__thumb {
    width: 64px;
    height: 64px;
    border-radius: 8px;
    flex-shrink: 0;
    object-fit: cover;
    display: block;
  }

  .info-card__body {
    display: flex;
    flex-direction: column;
    min-width: 0;
    flex: 1;
  }

  .info-card__tag {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 12px;
    line-height: 100%;
    letter-spacing: -0.04em;
    color: #3234AC;
    transition: color 0.15s ease;
  }

  .info-card__text {
    margin-top: 8px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 400;
    font-size: 14px;
    line-height: 140%;
    letter-spacing: -0.04em;
    color: #060B36;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color 0.15s ease;
  }

  .info-card:hover .info-card__tag,
  .info-card:hover .info-card__text,
  .info-card:active .info-card__tag,
  .info-card:active .info-card__text {
    color: #FFFFFF;
  }

  @media (max-width: 900px) {
    .cards-section {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 560px) {
    .cards-section {
      grid-template-columns: 1fr;
    }
  }

  .brands-section {

    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;

  .brand-card {
    height: 180px;
    background-color: #F4F2EF;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
    transition: background-color 0.2s ease;
  }

  .brand-card:not(.cta):hover {
    background-color: #EDEAE7;
  }

  .brand-pointer {
    position: absolute;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background-color: #6568EF;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s ease;
    transform: translate(-50%, -50%);
    z-index: 5;
  }

  .brand-pointer svg {
    width: 16px;
    height: 16px;
    display: block;
  }

  .brand-card img {
    max-width: 100%;
    max-height: 64px;
    display: block;
  }

  .brand-card > svg {
    max-width: 100%;
    max-height: 64px;
    width: auto;
    height: auto;
    display: block;
  }

  .brand-logo-placeholder {
    width: 210px;
    height: 64px;
    max-width: 100%;
    background-color: #D3D1C7;
    border-radius: 4px;
    display: block;

  .brand-card.cta {
    background-color: #6568EF;
    justify-content: center;
    align-items: center;
    padding: 24px;
  }

  .brands-text {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .brands-text p {
    padding: 0 80px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 32px;
    line-height: 120%;
    letter-spacing: -0.04em;
    color: #060B36;
    margin: 0;
  }

  .brands-text .accent {
    color: #F47B25;
  }

  @media (max-width: 900px) {
    .brands-section {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 560px) {
    .brands-section {
      grid-template-columns: 1fr;
    }
  }

  .about-section {
    width: calc(100% - 80px);
    margin: var(--section-spacing) 40px 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    border-radius: 8px;
    overflow: hidden;

  .about-panel {
    background-color: #060B36;
    position: relative;
    padding: 80px;

    min-height: 560px;

  .about-tag-group {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 3;
    display: flex;
    align-items: stretch;
  }

  .about-tag {
    height: 48px;
    box-sizing: border-box;
    background-color: #FFFFFF;
    color: #3234AC;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 14px;
    line-height: 100%;
    letter-spacing: -0.04em;
    padding: 19px 8px 19px 19px;
    border-top-left-radius: 8px;
    white-space: nowrap;
    display: flex;
    align-items: center;
  }

  .about-tag-corner {
    display: block;
    height: 48px;
    width: auto;
    flex-shrink: 0;
  }

  .about-title {
    color: #FFF;
    leading-trim: both;
    text-edge: cap;
    font-family: "Space Grotesk", sans-serif;
    font-size: 2rem;
    font-style: normal;
    font-weight: 500;
    line-height: 120%;
    letter-spacing: -0.08rem;
    margin: 0 0 24px;
  }

  .about-text {
    color: #FFF;
    leading-trim: both;
    text-edge: cap;
    font-family: "Space Grotesk", sans-serif;
    font-size: 1.25rem;
    font-style: normal;
    font-weight: 400;
    line-height: 160%;
    letter-spacing: -0.05rem;
    margin: 0 0 40px;
    max-width: 460px;
  }

  .about-buttons {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .cta-light-group {
    display: inline-flex;
    align-items: stretch;
  }

  .cta-light {
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    height: 48px;
    padding: 0 16px;
    background: #FFFFFF;
    color: #060B36;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 16px;
    line-height: 100%;
    letter-spacing: -0.04em;
    border: none;
    border-radius: 8px 0 0 8px;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color 0.2s ease;
  }

  .cta-light-icon {
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    background: #FFFFFF;
    border: none;
    border-left: 1px solid #ECECF2;
    border-radius: 0 8px 8px 0;
    cursor: pointer;
    transition: background-color 0.2s ease;
  }

  .cta-light-icon svg {
    width: 12px;
    height: 12px;
    display: block;
  }

  .cta-light-group:hover .cta-light,
  .cta-light-group:hover .cta-light-icon {
    background-color: #EDEAE7;
  }

  .about-media {
    background-color: #E4E4E9;
    min-height: 560px;
    border-radius: 8px;
    background-image: linear-gradient(135deg, #D3D1C7 0%, #F4C0D1 45%, #B5D4F4 100%);
  }

  @media (max-width: 900px) {
    .about-section {
      grid-template-columns: 1fr;
    }
    .about-media {
      min-height: 320px;
    }
  }

  .stats-section {
    width: calc(100% - 80px);
    margin: 20px 40px 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }

  .stat-card {
    display: flex;
    width: 21.625rem;
    padding: 2rem;
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
    border-radius: 0.5rem;
    background: var(--orange-100, #FEEFD3);
    box-sizing: border-box;
    width: 100%;
    min-width: 0;
  }

  @media (max-width: 900px) {
    .stats-section {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 560px) {
    .stats-section {
      grid-template-columns: 1fr;
    }
  }

  .stat-value {
    color: var(--orange-500, #F47B25);
    leading-trim: both;
    text-edge: cap;
    font-family: "Space Grotesk", sans-serif;
    font-size: 2rem;
    font-style: normal;
    font-weight: 500;
    line-height: 120%;
    letter-spacing: -0.08rem;
    margin: 0;
  }

  .stat-label {
    color: var(--midnight-500, #060B36);
    leading-trim: both;
    text-edge: cap;
    font-family: "Space Grotesk", sans-serif;
    font-size: 1.25rem;
    font-style: normal;
    font-weight: 400;
    line-height: 140%;
    letter-spacing: -0.05rem;
    margin: 0;
  }

  .news-section {
    width: calc(100% - 80px);
    margin: var(--section-spacing) 40px 40px;
  }

  .news-heading {
    color: var(--midnight-500, #060B36);
    text-align: center;
    leading-trim: both;
    text-edge: cap;
    font-family: "Space Grotesk", sans-serif;
    font-size: 2rem;
    font-style: normal;
    font-weight: 500;
    line-height: 120%;
    letter-spacing: -0.08rem;
    margin: 0 0 24px;
  }

  .news-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }

  .news-card {
    position: relative;
    height: 280px;
    border-radius: 8px;
    overflow: hidden;
    background-color: #E4E4E9;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    box-sizing: border-box;
    transition: border-radius 0.3s ease, border-color 0.3s ease;
    border: 1px solid transparent;
  }

  .news-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: var(--card-img, linear-gradient(135deg, #D3D1C7 0%, #F4C0D1 45%, #B5D4F4 100%));
    background-size: cover;
    background-position: center;
    z-index: 0;
    transition: transform 0.4s ease;
  }

  .news-card:not(.cta):hover {
    border-radius: 0.5rem;
    border: 1px solid #FFF;
  }

  .news-card:not(.cta):hover::after {
    transform: scale(1.1);
  }

  .news-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(6, 11, 54, 0) 40%, rgba(6, 11, 54, 0.85) 100%);
    z-index: 1;
    transition: background 0.3s ease;
  }

  .news-card:not(.cta):hover::before {
    background: linear-gradient(180deg, rgba(73, 76, 205, 0.00) 0%, #494CCD 100%);
  }

  .news-card__tag-group {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 3;
    display: flex;
    align-items: stretch;
  }

  .news-card__label {
    height: 48px;
    box-sizing: border-box;
    background-color: #FFFFFF;
    color: #F47B25;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 14px;
    line-height: 100%;
    letter-spacing: -0.04em;
    padding: 19px 8px 19px 19px;
    border-top-left-radius: 8px;
    white-space: nowrap;
    display: flex;
    align-items: center;
  }

  .news-card__corner {
    display: block;
    height: 48px;
    width: auto;
    flex-shrink: 0;
  }

  .news-card__content {
    position: relative;
    z-index: 2;
    padding: 24px;
  }

  .news-card__date {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 12px;
    line-height: 100%;
    letter-spacing: -0.04em;
    color: #FFFFFF;
    margin: 0 0 8px;
  }

  .news-card__title {
    overflow: hidden;
    color: var(--white-100, #FFF);
    leading-trim: both;
    text-edge: cap;
    text-overflow: ellipsis;
    font-family: "Space Grotesk", sans-serif;
    font-size: 1.25rem;
    font-style: normal;
    font-weight: 500;
    line-height: 140%;
    letter-spacing: -0.05rem;
    margin: 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .news-card__tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }

  .news-card__tag {
    display: flex;
    padding: 0.625rem;
    justify-content: center;
    align-items: center;
    gap: 0.25rem;
    border-radius: 0.375rem;
    background: var(--purple-200, #C2C4FD);
    color: #060B36;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 500;
    line-height: 100%;
    white-space: nowrap;
  }

  @media (max-width: 900px) {
    .news-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 560px) {
    .news-grid {
      grid-template-columns: 1fr;
    }
  }

  .news-card.cta {
    background-color: #6568EF;
    background-image: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .news-card.cta::before {
    content: none;
  }

  .news-card.cta::after {
    content: none;
  }

</style>

<script>
  const burger = document.getElementById('menuBurger');
  const mobileMenu = document.getElementById('mobileMenu');
  burger.addEventListener('click', () => {
    const isOpen = mobileMenu.classList.toggle('open');
    burger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  });

  const slides = [
    {
      title: 'Wij verbinden miljoenen mensen met inspirerende en betrouwbare content.'
    },
    {
      title: 'Wij verbinden miljoenen mensen met data-gedreven content.'
    },
    {
      title: 'Wij verbinden miljoenen mensen met impactvolle content.'
    }
  ];

  const heroTitle = document.querySelector('.hero-title');
  const heroAsset = document.querySelector('.hero-media__asset');
  const heroPlaceholders = document.querySelectorAll('.hero-media__placeholder');
  const carouselThumbs = document.querySelectorAll('.hero-carousel__thumb');
  const progressFill = document.querySelector('.hero-carousel__progress-fill');

  function goToSlide(index) {
    carouselThumbs.forEach((t) => t.classList.remove('is-active'));
    carouselThumbs[index].classList.add('is-active');

    const progress = ((index + 1) / carouselThumbs.length) * 100;
    progressFill.style.width = progress + '%';

    heroTitle.textContent = slides[index].title;

    heroAsset.style.display = index === 0 ? 'block' : 'none';
    heroPlaceholders.forEach((placeholder) => {
      const isMatch = Number(placeholder.getAttribute('data-slide')) === index && index !== 0;
      placeholder.classList.toggle('is-visible', isMatch);
    });
  }

  carouselThumbs.forEach((thumb) => {
    thumb.addEventListener('click', () => {
      const index = Number(thumb.getAttribute('data-index'));
      goToSlide(index);
    });
  });

  goToSlide(0);

  document.querySelectorAll('.brand-card:not(.cta)').forEach((card) => {
    const pointer = document.createElement('span');
    pointer.className = 'brand-pointer';
    pointer.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13 8.00003L3 2.22607L4.98712 8.00003L3 13.774L13 8.00003Z" fill="#FFFFFF"/></svg>';
    card.appendChild(pointer);

    let targetX = 0;
    let targetY = 0;
    let currentX = 0;
    let currentY = 0;
    let raf = null;

    function animate() {
      currentX += (targetX - currentX) * 0.2;
      currentY += (targetY - currentY) * 0.2;
      pointer.style.left = currentX + 'px';
      pointer.style.top = currentY + 'px';
      raf = requestAnimationFrame(animate);
    }

    card.addEventListener('mouseenter', (e) => {
      const rect = card.getBoundingClientRect();
      currentX = targetX = e.clientX - rect.left;
      currentY = targetY = e.clientY - rect.top;
      pointer.style.left = currentX + 'px';
      pointer.style.top = currentY + 'px';
      pointer.style.opacity = '1';
      if (!raf) raf = requestAnimationFrame(animate);
    });

    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      targetX = e.clientX - rect.left;
      targetY = e.clientY - rect.top;
    });

    card.addEventListener('mousedown', () => {
      pointer.style.backgroundColor = '#494CCD';
    });

    card.addEventListener('mouseup', () => {
      pointer.style.backgroundColor = '#6568EF';
    });

    card.addEventListener('mouseleave', () => {
      pointer.style.opacity = '0';
      pointer.style.backgroundColor = '#6568EF';
      if (raf) {
        cancelAnimationFrame(raf);
        raf = null;
      }
    });
  });
</script>
